<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body { background: #121212; font-family: Inter, -apple-system, sans-serif; position: relative; overflow: hidden; }

  /* The 1024x1024 source, cropped to the 2:1 band. object-position pulls the
     crop upward so the coin stays in frame rather than centring on pavement. */
  .photo {
    position: absolute; inset: 0;
    width: 1200px; height: 630px;
    object-fit: cover; object-position: center 42%;
  }
  /* Two overlays: a left-to-right wash so text has contrast, and a bottom
     vignette so the footer row stays legible over bright neon. */
  .wash {
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      rgba(10,10,12,0.94) 0%,
      rgba(10,10,12,0.88) 34%,
      rgba(10,10,12,0.52) 60%,
      rgba(10,10,12,0.20) 100%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(8,8,10,0.85) 0%, rgba(8,8,10,0) 34%);
  }
  .frame {
    position: absolute; inset: 0;
    padding: 62px 70px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .mast { display: flex; align-items: center; gap: 18px; }
  .mark {
    width: 54px; height: 54px; border-radius: 50%;
    background: #f97316;
    display: flex; align-items: center; justify-content: center;
    color: #121212; font-size: 34px; font-weight: 700;
    line-height: 1; padding-bottom: 3px;
    box-shadow: 0 0 34px rgba(249,115,22,0.6);
  }
  .wordmark {
    color: #ffffff; font-size: 21px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    text-shadow: 0 2px 14px rgba(0,0,0,0.9);
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700; font-size: 84px; line-height: 1.03;
    color: #ffffff; letter-spacing: -0.015em; max-width: 720px;
    text-shadow: 0 3px 26px rgba(0,0,0,0.92);
  }
  h1 em { font-style: normal; color: #fdba74; }
  .rule { width: 132px; height: 5px; background: #f97316; margin: 28px 0 24px; border-radius: 3px; }
  .sub {
    font-size: 30px; font-weight: 300; line-height: 1.38;
    color: #d6d6d6; max-width: 640px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.95);
  }
  .foot {
    display: flex; align-items: baseline; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.16); padding-top: 26px;
  }
  .tag { font-size: 23px; font-weight: 500; color: #c9c9c9; text-shadow: 0 2px 12px rgba(0,0,0,0.95); }
  .url { font-size: 25px; font-weight: 600; color: #fb923c; letter-spacing: 0.02em; text-shadow: 0 2px 12px rgba(0,0,0,0.95); }
</style>
</head>
<body>
  <img class="photo" src="source-neon-bitcoin.png" alt="" />
  <div class="wash"></div>
  <div class="vignette"></div>
  <div class="frame">
    <div class="mast">
      <div class="mark">&#8383;</div>
      <div class="wordmark">Bitcoin Envoy</div>
    </div>
    <div>
      <h1>Bitcoin for<br /><em>Beginners</em></h1>
      <div class="rule"></div>
      <p class="sub">Learn the fundamentals that actually matter &mdash; in about an hour.</p>
    </div>
    <div class="foot">
      <div class="tag">No jargon. No fluff.</div>
      <div class="url">bitcoinenvoy.co</div>
    </div>
  </div>
</body>
</html>
