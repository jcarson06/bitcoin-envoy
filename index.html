<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Bitcoin for Beginners — Learn Bitcoin Fundamentals in 1 Hour | Bitcoin Envoy</title>
    <meta
      name="description"
      content="New to Bitcoin? Bitcoin Envoy teaches you the most important Bitcoin fundamentals in about an hour — no jargon, no fluff. The clearest beginner's guide to Bitcoin on the internet."
    />
    <meta
      name="keywords"
      content="bitcoin for beginners, learn bitcoin, what is bitcoin, bitcoin basics, bitcoin fundamentals, bitcoin education, introduction to bitcoin, bitcoin guide"
    />
    <meta name="author" content="Bitcoin Envoy" />
    <!-- Canonical URL is injected per page by SEO/Helmet during prerender. -->

    <!-- Open Graph (Facebook, LinkedIn, AI link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bitcoin Envoy" />
    <meta property="og:title" content="Bitcoin for Beginners — Learn Bitcoin Fundamentals in 1 Hour" />
    <meta
      property="og:description"
      content="New to Bitcoin? Learn the most important Bitcoin fundamentals in about an hour. No jargon, no fluff — just clear, honest Bitcoin education for curious beginners."
    />
    <meta property="og:url" content="https://bitcoinenvoy.co/" />
    <meta
      property="og:image"
      content="https://storage.googleapis.com/gpt-engineer-file-uploads/R8lQS5PGx5bSJbDtC1fKUQEn4u03/social-images/social-1758109489482-Neon%20Bitcoin%20in%20Cyberpunk%20City.png"
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bitcoin for Beginners — Learn Bitcoin Fundamentals in 1 Hour" />
    <meta
      name="twitter:description"
      content="New to Bitcoin? Learn the most important Bitcoin fundamentals in about an hour. No jargon, no fluff."
    />
    <meta
      name="twitter:image"
      content="https://storage.googleapis.com/gpt-engineer-file-uploads/R8lQS5PGx5bSJbDtC1fKUQEn4u03/social-images/social-1758109489482-Neon%20Bitcoin%20in%20Cyberpunk%20City.png"
    />

    <!-- Site-level schema: per-page schema is injected by the SEO component during prerender -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Bitcoin Envoy",
        "url": "https://bitcoinenvoy.co",
        "description": "Bitcoin Envoy teaches Bitcoin fundamentals to beginners and curious people — covering the most important concepts in about one hour.",
        "teaches": "Bitcoin fundamentals, how Bitcoin works, Bitcoin for beginners",
        "audience": {
          "@type": "EducationalAudience",
          "educationalRole": "student",
          "audienceType": "Beginners and people curious about Bitcoin"
        },
        "founder": {
          "@type": "Person",
          "name": "Jeffrey Carson",
          "jobTitle": "Bitcoin Educator",
          "url": "https://bitcoinenvoy.co/about",
          "sameAs": [
            "https://x.com/jeffreyscarson",
            "https://www.linkedin.com/in/jscarson/"
          ]
        },
        "sameAs": [
          "https://x.com/jeffreyscarson"
        ]
      }
    </script>

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Favicon -->
    <link rel="icon" href="/bitcoin-favicon.png" type="image/png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded as a plain stylesheet rather than the preload + onload swap trick:
      that trick needs an inline event handler, which would force
      script-src 'unsafe-inline' in the CSP (see public/_headers). The
      preconnects above already cover most of the latency it saved.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <link rel="preload" href="/brockmann-medium-webfont.ttf" as="font" type="font/truetype" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
