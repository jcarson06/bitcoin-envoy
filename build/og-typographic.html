<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #121212;
    font-family: Inter, -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* Warm glow bleeding in from the right, echoing the site's hero */
  .glow {
    position: absolute;
    width: 900px; height: 900px;
    right: -280px; top: -220px;
    background: radial-gradient(circle, rgba(249,115,22,0.28) 0%, rgba(249,115,22,0.10) 38%, rgba(249,115,22,0) 68%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .frame {
    position: absolute; inset: 0;
    padding: 62px 70px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  /* Masthead */
  .mast { display: flex; align-items: center; gap: 18px; }
  .mark {
    width: 54px; height: 54px; border-radius: 50%;
    background: #f97316;
    display: flex; align-items: center; justify-content: center;
    color: #121212; font-size: 34px; font-weight: 700;
    line-height: 1; padding-bottom: 3px;
    box-shadow: 0 0 34px rgba(249,115,22,0.55);
  }
  .wordmark {
    color: #ffffff; font-size: 21px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  /* Headline block */
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700; font-size: 88px; line-height: 1.02;
    color: #ffffff; letter-spacing: -0.015em;
  }
  h1 em { font-style: normal; color: #fb923c; }
  .rule { width: 132px; height: 5px; background: #f97316; margin: 30px 0 26px; border-radius: 3px; }
  .sub {
    font-size: 31px; font-weight: 300; line-height: 1.38;
    color: #b8b8b8; max-width: 730px;
  }
  /* Footer */
  .foot {
    display: flex; align-items: baseline; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.10); padding-top: 26px;
  }
  .tag { font-size: 23px; font-weight: 500; color: #8a8a8a; letter-spacing: 0.01em; }
  .url { font-size: 25px; font-weight: 600; color: #f97316; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="frame">
    <div class="mast">
      <div class="mark">&#8383;</div>
      <div class="wordmark">Bitcoin Envoy</div>
    </div>
    <div>
      <h1>Bitcoin for<br /><em>Beginners</em></h1>
      <div class="rule"></div>
      <p class="sub">Learn the fundamentals that actually matter &mdash; in about an hour.</p>
    </div>
    <div class="foot">
      <div class="tag">No jargon. No fluff.</div>
      <div class="url">bitcoinenvoy.co</div>
    </div>
  </div>
</body>
</html>
